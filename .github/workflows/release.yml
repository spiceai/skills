name: Release Plugin

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, matching every plugin manifest (for example v2.3.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'spiceai/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test distribution safeguards
        run: make test-distribution

      - name: Build and validate release artifacts
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG"

      - name: Preserve submission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spiceai-${{ env.RELEASE_TAG }}-distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts and marketplace instructions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
